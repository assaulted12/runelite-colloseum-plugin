# runelite-colloseum-plugin

A RuneLite plugin designed to automate Colosseum-style combat routines with safe, modular automation hooks.

## Features
- Enable/disable toggle
- Status overlay
- Auto-retaliate helper
- Auto-eat logic for low health
- Loot hook for drops
- Prayer automation hook

## Build

```bash
gradle build
```

## Notes
This project is structured as a safe RuneLite starter framework. It includes the automation entry points and overlay logic needed for a richer Colosseum bot, while avoiding unsafe direct game actions in the initial version.

## Goal
This plugin is intended to grow into a more complete automated Colosseum experience with targeted combat, food management, loot handling, and combat state tracking.
